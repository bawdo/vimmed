[package]
name = "editor-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
editor-core = { path = "../editor-core" }
# The layout engine (Task 7 verdict, D6): the opt-in shape-run cache is trimmed once per painted
# frame through `TextLayout::end_frame`. Default features (std, swash, fontconfig) are kept.
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
tiny-skia = "0.12"
# The `Script` in cosmic-text's `Fallback` trait (the version cosmic-text resolves).
unicode-script = "0.5"
# Reads a looked-up face's cmap to check it really covers the codepoint
# (the version cosmic-text resolves).
swash = "0.2"
marks = { path = "../marks" }
# Code-block highlighting: the tree-sitter runtime and one grammar per supported language.
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-hcl = "1.1.0"
tree-sitter-md = "0.5.4"
