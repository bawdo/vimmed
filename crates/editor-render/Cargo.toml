[package]
name = "editor-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
editor-core = { path = "../editor-core" }
# The layout engine (Task 7 verdict, D6): the opt-in shape-run cache is trimmed once per painted
# frame through `TextLayout::end_frame`. Default features (std, swash, fontconfig) are kept.
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
marks = { path = "../marks" }
