[package]
name = "editor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Compiles the fuzz harnesses (`editor_core::fuzz`) for the fuzz/ crate.
fuzzing = []

[dependencies]
app-meta = { path = "../app-meta" }
marks = { path = "../marks" }
unicode-segmentation = "1.12"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
