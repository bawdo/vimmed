name: ClusterFuzzLite weekly fuzzing

# Long fuzzing run (an hour) on the default branch every Monday, then a corpus
# prune. Builds the corpus that the pull request job (cflite_pr.yml) starts
# from. Uses the default GITHUB_TOKEN only; the corpus lives in Actions
# artifacts (no storage repo). Can also be started by hand.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: read-all

# A manual run must not overlap the scheduled batch and prune.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  batch:
    name: Batch fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      # The SHA pins the action definitions; they run the mutable image
      # gcr.io/oss-fuzz-base/clusterfuzzlite-{build,run}-fuzzers:v1, which
      # upstream controls.
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: batch
          sanitizer: address

  prune:
    name: Corpus prune
    needs: batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      # The SHA pins the action definitions; they run the mutable image
      # gcr.io/oss-fuzz-base/clusterfuzzlite-{build,run}-fuzzers:v1, which
      # upstream controls.
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: prune
          sanitizer: address
