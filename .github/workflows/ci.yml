name: CI

permissions:
  contents: read

# Pull requests run this workflow directly. A release workflow can run it
# through workflow_call, where github.event_name is that of the caller.
# There is no push trigger for other branches: with a pull request open it
# would run every job a second time on the same commit. A branch with no
# pull request can be run by hand (workflow_dispatch) or checked locally with
# cargo xtask ci. The weekly schedule runs on the default branch and runs
# only cargo-deny and zizmor, because advisories change while the code does not.
on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

# A literal prefix, not github.workflow: when this file runs as a reusable
# workflow that context names the caller, which would put caller and callee
# in the same group and deadlock the run. A scheduled run gets a group of
# its own so it never holds up the CI of a push to main.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The same gate as the local one: cargo xtask ci runs fmt, clippy, test and
  # the repository lints. The toolchain comes from rust-toolchain.toml, which
  # rustup on the runner honours.
  macos:
    name: macOS
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run the CI gate
        run: cargo xtask ci

  linux:
    name: Linux
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libfontconfig-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The version matches CONTRIBUTING.md. llvm-tools-preview comes from
      # rust-toolchain.toml.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov@0.9.1

      # The test step runs under cargo llvm-cov, so the suite runs once and
      # writes target/lcov.info.
      - name: Run the CI gate with coverage
        run: cargo xtask ci --coverage

      # Coverage is informational. A fork or Dependabot pull request has no
      # secrets, so the token is empty there and the upload may fail; that
      # must not fail the job (fail_ci_if_error is false).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true

  # Builds docker/Dockerfile.check and runs the workspace plus a smoke run in
  # the container. Docker is already on the runner.
  linux-smoke:
    name: Linux container smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the Linux container check
        run: cargo xtask linux-check

  # Runs on every trigger, including the weekly schedule.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Audits the workflow files for security problems (script injection,
  # excess permissions, unpinned actions and so on). Runs on every trigger,
  # including the weekly schedule, because its online audits (such as known
  # vulnerable actions) change while the files do not. advanced-security is
  # off so the findings fail the job: the SARIF mode uploads them and
  # passes, and a fork or Dependabot pull request has a read-only token
  # that cannot upload. The zizmor version matches CONTRIBUTING.md, and
  # must stay within the versions the pinned action supports.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  # Shell, git and cargo metadata (for the version comparison), so it needs
  # nothing from macOS. fetch-depth 0 because the check reads tags and
  # history. The timeout allows for rustup installing the pinned toolchain
  # before cargo metadata runs.
  changelog:
    name: Changelog
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the changelog script
        run: bash scripts/changelog-version-test.sh

      - name: Check the newest CHANGELOG.md version is releasable
        run: scripts/changelog-version.sh check

      # A release heading must name the version the workspace builds, or
      # the release run on main fails after merge. Exit 3 from version
      # means there is no release heading yet, so there is nothing to
      # compare; any other failure fails the step.
      - name: Check Cargo.toml has the newest CHANGELOG.md version
        run: |
          set -euo pipefail
          rc=0
          version=$(scripts/changelog-version.sh version) || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "changelog: no release yet; no version to compare"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "changelog-version.sh version failed with exit $rc" >&2
            exit "$rc"
          fi
          cargo_versions=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | join(" ")')
          if [ "$cargo_versions" != "$version" ]; then
            echo "CHANGELOG.md says $version, Cargo.toml says $cargo_versions" >&2
            exit 1
          fi
          echo "changelog: $version matches Cargo.toml"

  # Spell check with typos, using typos.toml. Prose in Markdown is held to
  # Australian English; code is checked without a locale. The action version
  # matches CONTRIBUTING.md, because the action runs the typos release of
  # its own tag.
  typos:
    name: typos
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  # Checks REUSE compliance (reuse.software): every file has a licence and
  # copyright, here through REUSE.toml. The action runs the fsfe/reuse:6
  # image and has no input for the reuse version, so CI tracks the latest
  # 6.x while CONTRIBUTING.md pins the version for local runs.
  reuse:
    name: reuse
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Checks the workspace on the oldest Rust the manifest promises
  # (rust-version in Cargo.toml), so that promise is tested and not just
  # written down. It reads the version from the manifest, so there is no
  # second copy to keep in step. Both platforms, as each builds its own shell.
  msrv:
    name: MSRV
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libfontconfig-dev

      - name: Read the MSRV from Cargo.toml
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          if [ -z "$msrv" ] || [ "$msrv" = null ]; then
            echo "rust-version is not set in Cargo.toml" >&2
            exit 1
          fi
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the workspace on the MSRV
        run: cargo "+$MSRV" check --workspace --all-targets --locked

  # One stable check name for the main ruleset to require, so adding or
  # renaming a job above does not mean editing the ruleset as well.
  #
  # Every job in needs is expected to succeed, except the ones a trigger
  # skips on purpose:
  #   workflow_dispatch: none
  #   pull_request: none
  #   push (a caller via workflow_call): none
  #   schedule: macos, linux, linux-smoke, msrv, changelog, typos and reuse (only
  #     deny and zizmor run)
  # Any other event expects every job. A failed or cancelled job always
  # fails the gate, and so does a skip that the event does not allow, so a
  # job left out by a bad if: condition cannot pass unnoticed. A job added
  # to needs is expected under every trigger unless it is listed as a
  # permitted skip in the script below.
  ci-result:
    name: CI result
    if: always()
    needs: [macos, linux, linux-smoke, msrv, deny, zizmor, changelog, typos, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every expected job passed
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request|push|workflow_dispatch) may_skip='[]' ;;
            schedule) may_skip='["macos","linux","linux-smoke","msrv","changelog","typos","reuse"]' ;;
            *)        may_skip='[]' ;;
          esac
          # Mirrors needs above, so a job missing from the results fails too.
          all='["macos","linux","linux-smoke","msrv","deny","zizmor","changelog","typos","reuse"]'
          echo "Event: $EVENT (may skip: $may_skip)"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
          bad=$(jq -r --argjson all "$all" --argjson skip "$may_skip" '
            if type != "object" then "job results are not an object"
            else . as $needs | ($all + keys | unique)[]
              | . as $job | ($needs[$job].result // "missing") as $r
              | if $r == "success" then empty
                elif $r == "skipped" and ($skip | any(. == $job)) then empty
                else "\($job): \($r)" end
            end' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "Not passed:"
            nl=$'\n'
            echo "  ${bad//"$nl"/"$nl"  }"
            exit 1
          fi
          echo "Every expected job passed."
