# Coverage is informational: no status can fail a pull request, and there is
# no floor. The numbers are there to read, not to gate on.
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "xtask/**"
  - "crates/layout-bench/**"
  - "**/tests/**"

github_checks:
  annotations: true
