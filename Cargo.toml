[workspace]
resolver = "3"
members = [
    "crates/app-meta",
    "crates/editor-core",
    "crates/editor-render",
    "crates/marks",
    "crates/launcher",
    "crates/window",
    "xtask",
    "crates/layout-bench",
]
default-members = [
    "crates/app-meta",
    "crates/editor-core",
    "crates/editor-render",
    "crates/marks",
    "crates/launcher",
    "crates/window",
    "xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.92"

[workspace.metadata.app]
name = "foo_edit"
id_prefix = "com.bawdo"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
