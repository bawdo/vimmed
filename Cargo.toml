[workspace]
resolver = "3"
members = [
    "crates/app-meta",
    "crates/editor-core",
    "crates/editor-render",
    "crates/marks",
    "crates/launcher",
    "crates/detach",
    "crates/shell-mac",
    "crates/shell-gtk",
    "crates/window",
    "xtask",
    "crates/layout-bench",
]
default-members = [
    "crates/app-meta",
    "crates/editor-core",
    "crates/editor-render",
    "crates/marks",
    "crates/launcher",
    "crates/detach",
    "crates/shell-mac",
    "crates/shell-gtk",
    "crates/window",
    "xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/bawdo/vimmed"

[workspace.metadata.app]
name = "vimmed"
id_prefix = "com.bawdo"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
